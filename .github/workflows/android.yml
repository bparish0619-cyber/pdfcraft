name: Android APK

on:
  push:
    branches: [main, master, 'android/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NEXT_TELEMETRY_DISABLED: '1'
  BASE_PATH: ''
  NEXT_PUBLIC_BASE_PATH: ''
  ANDROID_VERSION_CODE: ${{ github.run_number }}
  ANDROID_VERSION_NAME: 0.1.0-android.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Validate native compilation before building web assets
        run: ./android/gradlew -p android --no-daemon :app:testDebugUnitTest :app:lintRelease
      - name: Install locked web dependencies and prepare engines
        run: npm ci --no-audit --no-fund
      - name: Build current web application and package assets
        run: |
          npx --no-install next build
          node android/scripts/prepare-assets.mjs
          node android/scripts/prepare-tests.mjs
      - name: Configure optional private signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pdfcraft-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pdfcraft-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Native tests, lint, release APK and instrumented test APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android/gradlew -p android --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK signature and contents
        run: |
          mkdir -p android-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk android-artifacts/PDFCraft-Android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-artifacts/PDFCraft-Android.apk
          python3 android/scripts/verify-apk.py android-artifacts/PDFCraft-Android.apk
          cd android-artifacts
          sha256sum PDFCraft-Android.apk > PDFCraft-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-artifacts/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-reports
          path: android/app/build/reports/
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pdfcraft-release.jks"

  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            profile: pixel_2
            name: phone
          - api: 35
            profile: pixel_c
            name: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: test-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/scripts/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.name }}-device-results
          path: device-results/

  publish:
    needs: [build, device-tests]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-artifacts
      - name: Publish tested rolling Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest > /dev/null 2>&1; then
            gh release edit android-latest --title 'PDFCraft Android — latest tested build' --notes-file android/RELEASE_NOTES.md --prerelease
          else
            gh release create android-latest --target "$GITHUB_SHA" --title 'PDFCraft Android — latest tested build' --notes-file android/RELEASE_NOTES.md --prerelease
          fi
          gh release upload android-latest android-artifacts/* --clobber
          echo "APK built from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
